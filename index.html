<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マスコットお小遣い帳 - Gothic Edition</title>

  <!-- ゴシック＆和風可愛いGoogle Fontsの読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* 全体背景：深紫〜漆黒のダークグラデーション */
    body {
      font-family: 'Kiwi Maru', serif, sans-serif;
      padding: 16px;
      background: radial-gradient(circle at top, #1e132b 0%, #0c0814 100%);
      background-attachment: fixed;
      text-align: center;
      color: #e2d9f3;
      margin: 0;
    }

    /* ゴシックカード枠（ガラスドーム風の透け感 ＋ 紫のネオン枠） */
    .card {
      background: rgba(22, 15, 34, 0.75);
      backdrop-filter: blur(8px);
      padding: 22px;
      border-radius: 16px;
      border: 1px solid rgba(147, 112, 219, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(138, 43, 226, 0.15);
      max-width: 480px;
      margin: 0 auto 20px;
    }

    /* 見出し装飾 */
    h2, h3 {
      font-family: 'Cinzel', 'Kiwi Maru', serif;
      margin-top: 0;
      color: #d8b4fe;
      text-shadow: 0 0 8px rgba(192, 132, 252, 0.4);
      letter-spacing: 1px;
    }

    /* フォームパーツ（ダーク入力エリア） */
    select, input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #4c3869;
      background: #120b1f;
      color: #f3e8ff;
      font-size: 14px;
      font-family: 'Kiwi Maru', serif;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
    }

    /* ゴシック紫ボタン */
    button {
      background: linear-gradient(135deg, #6b21a8 0%, #3b0764 100%);
      color: #f3e8ff;
      font-weight: bold;
      border: 1px solid #a855f7;
      cursor: pointer;
      margin-top: 12px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      box-shadow: 0 4px 15px rgba(107, 33, 168, 0.4);
    }

    button:hover {
      background: linear-gradient(135deg, #7e22ce 0%, #4c1d95 100%);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
    }

    button:active {
      transform: scale(0.97);
    }

    /* 進捗メーター（魔導ゲージ風） */
    .pace-container {
      margin-top: 12px;
      padding: 14px;
      background: rgba(10, 6, 18, 0.8);
      border-radius: 12px;
      border: 1px solid #3b2754;
    }

    .pace-status {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .pace-bar-bg {
      background: #1d132b;
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid #4a336e;
    }

    .pace-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.4s ease, background-color 0.4s ease;
      box-shadow: 0 0 8px currentColor;
    }

    .pace-details {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #a78bfa;
      margin-top: 8px;
    }

    /* 項目別グリッド表示 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 14px;
      text-align: left;
    }

    .summary-box {
      background: rgba(28, 18, 44, 0.8);
      border: 1px solid #3c2a57;
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-title {
      font-size: 11px;
      color: #c084fc;
    }

    .summary-amount {
      font-size: 13px;
      font-weight: bold;
      color: #f3e8ff;
    }

    /* 履歴テーブル（ゴシックダークスタイル） */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }

    th, td {
      padding: 10px 4px;
      text-align: center;
      border-bottom: 1px solid #2d1f42;
    }

    th {
      background: rgba(35, 22, 56, 0.9);
      color: #d8b4fe;
      font-weight: normal;
    }

    .badge-spend {
      color: #f43f5e;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(244, 63, 94, 0.3);
    }

    .badge-save {
      color: #38bdf8;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(56, 189, 248, 0.3);
    }

    .btn-delete {
      background: rgba(225, 29, 72, 0.2);
      color: #fda4af;
      border: 1px solid #f43f5e;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      width: auto;
      margin: 0;
      cursor: pointer;
    }

    .btn-delete:hover {
      background: #e11d48;
      color: white;
    }

    /* エラー表示 */
    #errorLog {
      background: #4c0519;
      color: #fecdd3;
      border: 1px solid #f43f5e;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      text-align: left;
      white-space: pre-wrap;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- エラーログ表示枠 -->
  <div id="errorLog"></div>

  <!-- 入力フォーム -->
  <div class="card">
    <h2>✦ 散財防衛フォーム ✦</h2>
    <select id="type">
      <option value="spend">💸 出費（部屋が荒れる…）</option>
      <option value="save">✨ 入金・予算分け（部屋が豪華に！）</option>
    </select>
    
    <select id="category">
      <option value="おこづかい">👛 おこづかい</option>
      <option value="日用品">🧻 日用品</option>
      <option value="医療費">🏥 医療費</option>
      <option value="食費">🍚 食費</option>
      <option value="教室代">🎨 教室代</option>
      <option value="サブスク積み立て">📱 サブスク積み立て</option>
      <option value="テーマパーク積み立て">🏰 テーマパーク積み立て</option>
      <option value="ファッションメイク費">💄 ファッションメイク費</option>
      <option value="交通費">🚃 交通費</option>
      <option value="美容院代">✂️ 美容院代</option>
    </select>

    <input type="number" id="amount" placeholder="金額（例: 500）" inputmode="numeric">
    <input type="text" id="memo" placeholder="メモ（例: カフェ代など）">
    <button id="sendBtn" onclick="sendData()">魔導記録を送信する ✦</button>
  </div>

  <!-- 全体ペース可視化カード -->
  <div class="card">
    <h3>🔮 今月の目標ペース進捗</h3>
    <div class="pace-container">
      <div class="pace-status" id="paceMessage">計算中...</div>
      <div class="pace-bar-bg">
        <div class="pace-bar-fill" id="paceBar"></div>
      </div>
      <div class="pace-details">
        <span>現在の支出: <b id="totalSpentText">0円</b></span>
        <span>今日時点の理想: <b id="targetPaceText">0円</b></span>
      </div>
    </div>
  </div>

  <!-- 集計表示 -->
  <div class="card">
    <h3>🕯️ 項目別の残高・積み立て</h3>
    <div class="summary-grid">
      <div class="summary-box"><span class="summary-title">👛 おこづかい</span><span class="summary-amount" id="sum-おこづかい">0円</span></div>
      <div class="summary-box"><span class="summary-title">🧻 日用品</span><span class="summary-amount" id="sum-日用品">0円</span></div>
      <div class="summary-box"><span class="summary-title">🏥 医療費</span><span class="summary-amount" id="sum-医療費">0円</span></div>
      <div class="summary-box"><span class="summary-title">🍚 食費</span><span class="summary-amount" id="sum-食費">0円</span></div>
      <div class="summary-box"><span class="summary-title">🎨 教室代</span><span class="summary-amount" id="sum-教室代">0円</span></div>
      <div class="summary-box"><span class="summary-title">📱 サブスク</span><span class="summary-amount" id="sum-サブスク積み立て">0円</span></div>
      <div class="summary-box"><span class="summary-title">🏰 テーマパーク</span><span class="summary-amount" id="sum-テーマパーク積み立て">0円</span></div>
      <div class="summary-box"><span class="summary-title">💄 ファッション</span><span class="summary-amount" id="sum-ファッションメイク費">0円</span></div>
      <div class="summary-box"><span class="summary-title">🚃 交通費</span><span class="summary-amount" id="sum-交通費">0円</span></div>
      <div class="summary-box"><span class="summary-title">✂️ 美容院代</span><span class="summary-amount" id="sum-美容院代">0円</span></div>
    </div>
  </div>

  <!-- 履歴表示 -->
  <div class="card">
    <h3>📜 直近の履歴</h3>
    <table>
      <thead>
        <tr>
          <th>項目</th>
          <th>金額</th>
          <th>メモ</th>
          <th>削除</th>
        </tr>
      </thead>
      <tbody id="historyTable">
        <tr><td colspan="4">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>

  <script type="module">
    function showError(msg) {
      const errBox = document.getElementById("errorLog");
      errBox.style.display = "block";
      errBox.innerText += "⚠️ " + msg + "\n";
    }

    window.addEventListener('error', (e) => showError("JSエラー: " + e.message));

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, serverTimestamp, query, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCiz6aIYYWjXEvSe1biT24_i8Qkfri5nSA",
      authDomain: "mascotkakeibo.firebaseapp.com",
      projectId: "mascotkakeibo",
      storageBucket: "mascotkakeibo.firebasestorage.app",
      messagingSenderId: "918089116802",
      appId: "1:918089116802:web:3fad2e9a56345c1a88d89b"
    };

    let db;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch(e) {
      showError("Firebase初期化失敗: " + e.message);
    }

    const categories = [
      "おこづかい", "日用品", "医療費", "食費", "教室代",
      "サブスク積み立て", "テーマパーク積み立て", "ファッションメイク費", "交通費", "美容院代"
    ];

    window.sendData = async function() {
      const type = document.getElementById("type").value;
      const category = document.getElementById("category").value;
      const amount = Number(document.getElementById("amount").value);
      const memo = document.getElementById("memo").value;

      if (!amount) return alert("金額を入力してね！");
      const btn = document.getElementById("sendBtn");
      btn.disabled = true;

      try {
        await addDoc(collection(db, "logs"), {
          type: type,
          category: category,
          amount: amount,
          memo: memo || "-",
          timestamp: serverTimestamp()
        });
        document.getElementById("amount").value = "";
        document.getElementById("memo").value = "";
      } catch (e) {
        showError("送信エラー: " + e.message);
      } finally {
        btn.disabled = false;
      }
    };

    window.deleteLog = async function(id) {
      if (confirm("この記録を削除しますか？")) {
        try {
          await deleteDoc(doc(db, "logs", id));
        } catch (e) {
          showError("削除エラー: " + e.message);
        }
      }
    };

    try {
      const q = query(collection(db, "logs"));
      onSnapshot(q, (snapshot) => {
        const tbody = document.getElementById("historyTable");
        tbody.innerHTML = "";

        let totals = {};
        categories.forEach(cat => totals[cat] = 0);

        let grandBudget = 0;
        let grandSpent = 0;

        if (snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="4">まだ履歴がありません</td></tr>';
        }

        let docs = [];
        snapshot.forEach(docSnap => {
          docs.push({ id: docSnap.id, ...docSnap.data() });
        });

        docs.sort((a, b) => {
          const tA = a.timestamp ? a.timestamp.seconds : 0;
          const tB = b.timestamp ? b.timestamp.seconds : 0;
          return tB - tA;
        });

        let count = 0;
        docs.forEach((data) => {
          const id = data.id;
          const cat = data.category || "おこづかい";
          const amt = Number(data.amount) || 0;

          if (data.type === "save") {
            if (totals[cat] !== undefined) totals[cat] += amt;
            grandBudget += amt;
          } else {
            if (totals[cat] !== undefined) totals[cat] -= amt;
            grandSpent += amt;
          }

          if (count < 10) {
            const tr = document.createElement("tr");
            const typeColor = data.type === "spend" ? "badge-spend" : "badge-save";
            const sign = data.type === "spend" ? "-" : "+";

            tr.innerHTML = `
              <td><small>${cat}</small></td>
              <td class="${typeColor}">${sign}${amt.toLocaleString()}円</td>
              <td><small>${data.memo || "-"}</small></td>
              <td><button class="btn-delete" onclick="deleteLog('${id}')">🗑️</button></td>
            `;
            tbody.appendChild(tr);
            count++;
          }
        });

        categories.forEach(cat => {
          const el = document.getElementById(`sum-${cat}`);
          if (el) el.innerText = totals[cat].toLocaleString() + "円";
        });

        updatePaceUI(grandBudget, grandSpent);

      }, (err) => {
        showError("Firestore取得エラー: " + err.message);
      });
    } catch(e) {
      showError("処理全体の例外: " + e.message);
    }

    function updatePaceUI(budget, spent) {
      const now = new Date();
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const currentDay = now.getDate();

      const targetPace = Math.round((budget / daysInMonth) * currentDay);

      document.getElementById("totalSpentText").innerText = spent.toLocaleString() + "円";
      document.getElementById("targetPaceText").innerText = targetPace.toLocaleString() + "円";

      const bar = document.getElementById("paceBar");
      const msg = document.getElementById("paceMessage");

      if (budget <= 0) {
        msg.innerText = "✦ 袋にお金を入れると目標ペースが算出されます ✦";
        msg.style.color = "#a78bfa";
        bar.style.width = "0%";
        bar.style.backgroundColor = "#4c1d95";
        return;
      }

      const percentage = targetPace > 0 ? Math.min(Math.round((spent / targetPace) * 100), 100) : 0;
      bar.style.width = percentage + "%";

      if (spent <= targetPace) {
        msg.innerText = "✨ 輝く節約力！目標ペース維持中（リッチ）";
        msg.style.color = "#c084fc"; // 妖艶な明紫
        bar.style.backgroundColor = "#a855f7";
      } else if (spent <= targetPace * 1.1) {
        msg.innerText = "🌱 順調なやりくり（普通）";
        msg.style.color = "#38bdf8"; // 水色ネオン
        bar.style.backgroundColor = "#0284c7";
      } else if (spent <= targetPace * 1.3) {
        msg.innerText = "⚠️ 散財の予兆…！（警告）";
        msg.style.color = "#fbbf24"; // 金色
        bar.style.backgroundColor = "#d97706";
      } else {
        msg.innerText = "🚨 散財警報発令中！（ピンチ）";
        msg.style.color = "#f43f5e"; // 赤紫
        bar.style.backgroundColor = "#e11d48";
      }
    }
  </script>
</body>
</html>
